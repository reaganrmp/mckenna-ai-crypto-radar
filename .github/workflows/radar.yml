name: ai-crypto-radar

on:
  schedule:
    - cron: "*/30 * * * *"     # runs every 30 minutes
  workflow_dispatch:            # adds a manual "Run workflow" button

permissions:
  contents: write              # needed so the workflow can commit the daily-count state file

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          JAYDEN_BOT_TOKEN: ${{ secrets.JAYDEN_BOT_TOKEN }}
      - name: Save daily pack count (if changed)
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Update daily pack count [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
